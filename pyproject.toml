[project]
name = "bytexl-ops"
version = "0.1.0"
description = "byteXL Ops Intelligence Platform — program lifecycle from MoU to trainer payout"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "openai>=1.50",          # OpenRouter speaks the OpenAI wire format
    # CLAUDE.md §2: agents run on LangGraph with a Postgres checkpointer, so a
    # program graph can pause for days awaiting a human (§8). The checkpointer is
    # a separate distribution from the graph runtime, and both are needed for the
    # supervisor to be durable rather than merely in-process.
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-jose[cryptography]>=3.3",
    "openpyxl>=3.1",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# --- Conventions: CLAUDE.md §11 ----------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"tools/*" = ["ANN"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Third-party packages without stubs.
[[tool.mypy.overrides]]
module = ["openpyxl.*", "jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live database or network",
    "rls: persona boundary tests, require DATABASE_URL",
]
